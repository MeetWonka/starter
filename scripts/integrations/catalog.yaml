# Hand-maintained overrides for the integrations catalog page.
#
# Everything else (which connectors exist, how they authenticate, their logos)
# comes from servers.json, refreshed with `python3 scripts/integrations/build.py sync`.
# Only edit this file when a new connector needs a nicer name, a hint on where
# to find its API key, or must be hidden from the public catalog.

# Connectors present in the WonkaChat config but not listed on the help page:
# test servers and legacy duplicates of a connector that has a newer version.
hidden:
  - odoo-test
  - cal.com            # superseded by cal_v2
  - outlook_mail       # superseded by outlook_v2
  - outlook_calendar   # superseded by outlook_v2

# Force a connection mode when it cannot be inferred from the config.
# Modes: oauth | api_key | credentials | assisted
modes:
  horus: oauth          # OAuth runs inside the MCP: the sign-in link is given in the chat
  ringover: api_key

# Short note shown on a connector's card, per language.
notes:
  horus:
    en: Activate it, then ask WonkaChat to connect your Horus license. It replies with a Horus sign-in link.
    fr: Activez-le, puis demandez à WonkaChat de connecter votre licence Horus. Il vous répond avec un lien de connexion Horus.
    nl: Activeer hem en vraag WonkaChat om uw Horus-licentie te koppelen. U krijgt een Horus-aanmeldlink terug.

