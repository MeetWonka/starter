# Where to find the API key, per language. Shown in the "API key" table.
# Menu paths change over time: keep them short and point to the area, not the exact click.
api_key_hints:
  apify_v2:
    en: Apify Console → Settings → API & Integrations
    fr: Console Apify → Settings → API & Integrations
    nl: Apify Console → Settings → API & Integrations
  apollo_v2:
    en: Apollo → Settings → Integrations → API (master key)
    fr: Apollo → Settings → Integrations → API (clé « master »)
    nl: Apollo → Settings → Integrations → API (master key)
  dropcontact_v2:
    en: Dropcontact → your account → API
    fr: Dropcontact → votre compte → API
    nl: Dropcontact → uw account → API
  fireflies_v2:
    en: Fireflies → Integrations → Fireflies API
    fr: Fireflies → Integrations → Fireflies API
    nl: Fireflies → Integrations → Fireflies API
  heyreach_v2:
    en: HeyReach → Settings → Integrations → API key
    fr: HeyReach → Settings → Integrations → API key
    nl: HeyReach → Settings → Integrations → API key
  instantly_v2:
    en: Instantly → Settings → Integrations → API keys
    fr: Instantly → Settings → Integrations → API keys
    nl: Instantly → Settings → Integrations → API keys
  leexi_v2:
    en: Leexi → Settings → API keys (company admin)
    fr: Leexi → Paramètres → Clés API (administrateur de l'entreprise)
    nl: Leexi → Instellingen → API-sleutels (bedrijfsbeheerder)
  lemlist_v2:
    en: lemlist → Settings → Integrations → API
    fr: lemlist → Paramètres → Intégrations → API
    nl: lemlist → Settings → Integrations → API
  nocrm_io_v2:
    en: noCRM.io → Admin panel → Integrations → API keys
    fr: noCRM.io → Panneau d'administration → Intégrations → Clés API
    nl: noCRM.io → Admin panel → Integrations → API keys
  pipedrive_v2:
    en: Pipedrive → Personal preferences → API
    fr: Pipedrive → Préférences personnelles → API
    nl: Pipedrive → Persoonlijke voorkeuren → API
  ringover:
    en: Ringover dashboard → Developer → API keys (created by an admin, EU workspaces only)
    fr: Tableau de bord Ringover → Développeur → Clés API (créée par un admin, espaces UE uniquement)
    nl: Ringover-dashboard → Developer → API-sleutels (aangemaakt door een beheerder, alleen EU-werkruimtes)
  semrush_v2:
    en: Semrush → Subscription info → API units (Business plan required)
    fr: Semrush → Subscription info → API units (abonnement Business requis)
    nl: Semrush → Subscription info → API units (Business-abonnement vereist)
  smartlead_v2:
    en: Smartlead → Settings → API key
    fr: Smartlead → Settings → API key
    nl: Smartlead → Settings → API key
  tally_v2:
    en: Tally → Settings → API keys
    fr: Tally → Paramètres → Clés API
    nl: Tally → Settings → API keys
